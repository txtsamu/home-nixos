name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Formatting check + full evaluation of nixosConfigurations.home
      # (a broken module fails here instead of at `nixos-rebuild switch`).
      - name: nix flake check
        run: nix flake check --show-trace
      # Full build of the system closure - catches build-time failures
      # (broken fetches, hash mismatches, failing derivations) before a
      # switch on the host. Possible since the checkmk agent (fetched from a
      # LAN-only server) was removed on 2026-09-28.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build system closure
        run: |
          nix build -L .#nixosConfigurations.home.config.system.build.toplevel
          echo "toplevel: $(readlink -f result)" >> "$GITHUB_STEP_SUMMARY"
